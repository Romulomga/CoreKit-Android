// O estilo dos apps e das libs num lugar só: cada módulo aplica este script (no app, pelo caminho do submódulo).
configurations {
    ktlint
}

dependencies {
    ktlint "com.pinterest.ktlint:ktlint-cli:1.8.0"
}

tasks.register("ktlint", JavaExec) {
    group = "verification"
    description = "Check Kotlin code style."
    classpath = configurations.ktlint
    mainClass.set("com.pinterest.ktlint.Main")
    args "src/**/*.kt"

    // Sem entradas e saídas declaradas a tarefa rodava sempre, mesmo sem nada mudado.
    inputs.files(fileTree("src") { include "**/*.kt" }, rootProject.file(".editorconfig")).withPropertyName("sources")
    outputs.file(layout.buildDirectory.file("ktlint/ok"))
    doLast { outputs.files.singleFile.text = "" }
}

tasks.named("check") { dependsOn("ktlint") }

tasks.register("ktlintFormat", JavaExec) {
    group = "formatting"
    description = "Fix Kotlin code style deviations."
    classpath = configurations.ktlint
    mainClass.set("com.pinterest.ktlint.Main")
    args "-F", "src/**/*.kt"
    jvmArgs "--add-opens=java.base/java.lang=ALL-UNNAMED"
}
